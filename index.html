const D={"source": [{"number": 1, "texts": ["MARKETING MANAGER US", "ESTRATEGIA ANUAL FRAGANCIAS. FRALLIER USA", "Propietario y confidencial."], "tables": []}, {"number": 2, "texts": ["ENTORNO"], "tables": [[["", "", "ANÁLISIS", "IMPLICACIÓN"], ["P", "POLÍTICO \n(Y POLÍTICA COMERCIAL)", "Estabilidad TMEC y riesgo de fricción comercial/leyes\nOperación en frontera (inspecciones, demoras, documentación)\nDependencia México→EE. UU. (logística transfronteriza)", "Al escalar, aumenta la exposición a cambios y revisiones; se requiere “trade compliance” robusto para crecer sin interrupciones.\nEl crecimiento depende de OTIF/lead time: documentación y coordinación con importador para evitar atrasos.\nResiliencia operativa para sostener expansión: plan B logístico (ej.distribuidores) y continuidad de suministro."], ["E", "ECONÓMICO", "Macro EE. UU. (demanda, inflación, presión a márgenes)\nCostos de cumplimiento y documentación (por SKU/cliente)\nVolatilidad de insumos/tipo de cambio/ costo energía", "Clientes medianos pedirán optimización costo/performance; ajustar portafolio a value (costo) para afrontar presión en consumo/márgenes o a premium (diferenciación) para marcas que compiten por diferenciación (márgenes altos)*.\nDiferencial: proveedor que reduce carga de compliance y acelera lanzamientos.\nProteger crecimiento con estrategia de precios y alternativas de formulación/abasto."], ["S", "SOCIAL", "Transparencia de ingredientes (California como benchmark)\nSensibilidad a alérgenos y “safer products”\nPreferencias olfativas regionales (mercado diverso) y estacionales", "Ventaja: entregar paquetes de disclosure listos para retail/CA.\nDiferencial: fragancias con enfoque seguridad + soporte técnico para claims y riesgo reputacional.\nCrecer requiere hacer perfiles a la medida por segmento/cliente sin multiplicar complejidad."], ["T", "TECNOLÓGICO", "Regulación (CAS) y trazabilidad (fichas técnicas SDS y documentación)\nReformulación ágil (restricciones/ estándares VOC/ingredientes)\nEvaluación de desempeño aplicada (tests por categoría: laundry+home care/air care/fine fragrance+cosmetics)", "Escalar exige automatizar compliance y responder rápido a auditorías/clientes.\nDiferencial:  reformular rápido sin perder desempeño sensorial.\nCrecer requiere demostrar performance medible (estabilidad, compatibilidad, olor residual)."], ["L", "LEGAL", "Retail California SB 258 (disclosure en etiquetado, comunicación para cleaning/laundry/air care). SDS/HazCom (para HI&I)\nSeguridad de químicos (TSCA, OSHA HazCom) y obligaciones del importador/cliente\nEstándares IFRA (fine fragrance y otros), MOCRA (cosméticos y cuidado personal)", "Crecer requiere datos de ingredientes (CAS) y soporte técnico en disclosure para clientes en CA (suele dictar el estándar a nivel país).\nMantener/crecer portafolio exige control de inventario/estatus químico y coordinación con importador.\nDiferencial: fragancias IFRA-ready / MOCRA-ready con límites claros por aplicación/categoría."], ["E", "AMBIENTAL", "Estándares VOC y regulación ambiental (ej. CA/CARB)\nSustitución de sustancias de preocupación (regulatoria + retailers)\nPresión por sostenibilidad (huella, abastecimiento, “clean”)", "Diferencial: low-VOC/low-emissions por aplicación.\nCrecer requiere un portafolio “future-proof” y sustituciones rápidas de ingredientes.\nDiferencial: propuestas de sostenibilidad defendible (sin greenwashing) y documentación."]]]}, {"number": 3, "texts": ["Acciones 2026–2027: \n(1) portafolio value/premium por región\n(2) paquetes documentales\n(3) velocidad de reformulación"], "tables": []}, {"number": 4, "texts": ["BENCHMARK DEL SECTOR", "IFF → SCENT CHAT: permite que participantes seleccionados se comuniquen en tiempo real con perfumistas, a través de WA y FB. Analizando las respuestas genera insights para toma de decisiones en el desarrollo. (IFF, 2025)\n\nDSM-FIRMENICH → PROVEEDOR DE SOLUCIONES PARA EL CONSUMIDOR ACTUAL Y FUTURO: cómo reciben nuevas fragancias, compras digitales sin oler primero, estrategia para identificar futuras oportunidades - Stephanie K., Associate Director Perfumery\n\nGIVAUDAN → PROVEEDOR DE LANZAMIENTOS EXITOSOS: apoyan al cliente con claims, workshops, etiquetado y visualización de producto terminado y realizan visitas directas a consumidores, o desarrollan estudios conjuntamente  - Paulina A., Fragrance Director\n\nEn común: \nMarketing ABM (Account-based) con equipos multidisciplinarios por categoría (ej. Beauty / Home Care / Fine Fragrance) \nTratan a sus perfumistas como celebridades."], "tables": []}, {"number": 5, "texts": ["MERCADO. SEGMENTACIÓN Y TARGET", "Compradores de fragancias B2B en EUA, por rentabilidad (+ a -):\n1) Brand owners / CMOs (fine fragrance y marcas premium home fragrance)\nDiferenciación, precio-creatividad, soporte técnico-documental.\nCostos altos de servicio (iteraciones, tiempos, aprobación).\n2) Manufacturers / Formulators, medianos con foco en diferenciación (velas, difusores, premium home)\nCompiten por novedades (rotación de aromas, nuevas colecciones), velocidad e innovación.\nPresión por tiempos y consistencia, volúmenes medianos.\n3) Home care/ HI&I/Laundry Manufacturers (masivo)\nVolumen y recurrencia.\nMercado sensible a precio, presión de costo por kilo y negociaciones (performance/costo), oferta “regulatory-ready”.\n4) Distributors / Brokers\nAumentar cobertura y volumen.\nCapturan parte del margen y el producto puede tender a compararse más (comoditización).", "TARGET DE GROWTH: → Clientes con mayor valor estratégico y rentabilidad de los segmentos:\nPremium pipeline: Brand owners/CMOs y fabricantes de productos diferenciados y premium (más rentables) en regiones más rentables de Northeast y West. \nValue pipeline: Home care/laundry/HI&I y distribuidores como palancas para escalar el negocio (sostener margen con compliance).\n\nTARGET BASE-RUN\nMantenimiento de cartera actual:\n\nClientes por Tier 1 a 3*, de más a menos valiosos.", "Clusters de preferencias olfativas en EUA*, por región y rentabilidad (+ a -):\nNortheast\nTendencia a: “cozy/comfort”  home scent (vanilla/pumpkin/cranberry) \nBuyer mix: brand owners + retail-driven\nWest (incluye CA como benchmark y estandarización regulatorio/comercial)\nTendencia a: “clean/transparent + lifestyle” (afinidad por propuestas ‘clean’/niche en algunas zonas) \nBuyer mix: brand owners (indie/premium), retail-driven, CMOs orientados a lanzamientos rápidos. Home fragrance manufacturers (velas/difusores), distribuidores fuertes para cobertura regional y respuesta rápida.\nSouth\nTendencia a: “fresh/clean + bold” home care, laundry, fine fragrance (cítricos/perfiles masculinos)\nBuyer mix: manufacturers (home care/laundry/HI&I) y marcas medianas orientadas a volumen.\n4.  Midwest\nTendencia a: “clean/functional” (señales de limpieza, notas frescas/ligeras)\nBuyer mix: CPG, HI&I manufacturers y canales masivos."], "tables": []}, {"number": 6, "texts": ["ESTRATEGIA ANUAL"], "tables": [[["RACE FRAMEWORK STRATEGY", "PUNTOS DE CONTACTO FÍSICOS/DIGITALES Y ACTIVIDADES DE MARKETING 360º", "HERRAMIENTAS DIGITALES"], ["REACH \n(AWARENESS + CONSIDERATION)", "Marketing de contenido inbound (tendencias, aplicaciones, etiquetado, lanzamientos, producto terminado de clientes) \nSEO y GEO (posicionamiento de palabras clave en buscadores y agentes)\nListing en directorios online (ej. Knowde, SpecialChem, UL Prospector) \nDesarrollo de distribuidores \nADS + PR en publicaciones de la industria (ej. Perfumer & Flavorist) y LinkedIn*", "Blog\nLinkedIn\nSitio Web \nSuscripción a GenAI \nSuscripción a sitios de tendencias y análisis del consumidor (ej. Euromonitor, Nielsen, Kantar, etc.)"], ["ACT\n(LEAD GENERATION)", "Entrega y envío (ej. Knowde) de muestras a leads calificados\nFormulario de leads+ chatbot en sitio web (intención → filtración de leads calificados → contacto con Ventas)\nEventos experienciales (expos y ferias) \nWebinars (soluciones, tendencias, aplicaciones)\nVisitas a planta / Aromateca de leads calificados \nDescarga de reportes de tendencias / consumer insights/aplicaciones en producto terminado\nPR de lanzamientos + en columnas de opinión + paneles\nAgencias para generar leads (temporal y durante el arranque)", "LinkedIn \nSitio Web\nZoom"], ["CONVERT", "Sumisiones/aplicaciones con el equipo técnico a leads calificados** \nNegociaciones estratégicas con clientes y leads calificados\nFirma digital de contratos\nDescarga de paquetes de información (compliance + disclosure) disponible para clientes Tier 1-Tier 3 (prioridad a HI&I/laundry/air care)\nSoporte en producto terminado (conceptos, claims, etiquetado, mockup de producto) a clientes valiosos Tier 1 y Tier 2\nIntel de comportamiento del consumidor y oportunidades de mercado (insights, estudios, estrategia) a clientes valiosos Tier 1 y Tier 2\nPR en premios de la industria (sales pitch)", "Nube \nHerramientas internas de capacitación y cursos \nLead scoring, CRM y tracker (ej. Monday, HubSpot, Salesforce) de pipelines, leads, lanzamientos e igualaciones, muestras enviadas, etc.\nFirma digital (ej. DocuSign)"], ["ENGAGE\n(LOYALTY + REPEAT PURCHASES + BRAND ADVOCACY)", "CRM (newsletter segmentado + alertas automatizadas de re-stock)\nInternal Cross-Functional Workshops (analizar comportamientos y tendencias → estudios → pruebas → implementación)\nExcelencia y valor añadido en servicio al cliente, segmentado por categorías (fine fragrance/cosmetics, HI&I+laundry+air care/ premium home care) Ej:\nPágina web para crear claims e info de etiquetado (según producto terminado) para tier de clientes de menor valor\nWorkshops exclusivos anuales a clientes valiosos Tier 1 y Tier 2 (post-servicio)\nPR en lanzamientos de cliente (permitidos) y logros en LinkedIn", "Landing pages\nCRM"]]]}, {"number": 7, "texts": ["KPIs"], "tables": [[["RACE FRAMEWORK STRATEGY", "KPI"], ["REACH \n(AWARENESS + CONSIDERATION)", "Tasa de conversión de MQL (Marketing Qualified Leads) a SQL (Sales Qualified Leads): 15–30%\nTráfico Orgánico y Pagado al sitio web \nCTR (Click-Through Rate) y CPC (Coste por Clic) de anuncios online y en directorios online \nCosto por Lead (CPL) digital\nCosto por Lead (CPL) prospección directa"], ["ACT\n(LEAD GENERATION)", "Costo por adquisición de cliente (CAC)\nPipeline generado por canal"], ["CONVERT", "Tasa de conversión de muestra enviada a orden de compra (Sample-to-Order Rate)\nTiempo de desarrollo y homologación técnica (laboratorio y ventas) para entrega y aprobación \nVelocidad del Pipeline (Pipeline Velocity) entre detectar una marca hasta la firma de contrato\nMQL (Marketing Qualified Leads) \nSQL (Sales Qualified Leads)\nTasa de conversión de prospecto a cliente (Lead-to-customer conversion rate)\nTiempo del ciclo de ventas (Sales cycle length) prospecto-cierre de venta \n% de ingresos atribuidos a marketing (Revenue Attributed to Marketing)\nROI (Return Over Investment) \n# de órdenes de compra \nCuota de Ventas Alcanzada (Quota Attainment), en volumen o $\nNet Revenue Retention (NRR) > 100% \nConcentración de Ingresos por Cliente <20%"], ["ENGAGE\n(LOYALTY + REPEAT PURCHASES + BRAND ADVOCACY)", "Tasa de recompra (Retention Rate) por volumen y recurrencia\nValor de Vida del Cliente (CLTV) vs Costo por Adquisición de Cliente  (CPA) min. 3:1 \n# de sesiones de innovación\nTasa de Expansión de Cuenta (Up-selling / Cross-selling)"]]]}, {"number": 8, "texts": ["PRESUPUESTO. ADMINISTRACIÓN", "Propuesta de asignación, asumiendo el posicionamiento más rentable (con hipótesis de capacidades de los equipos internos): “Frallier como proveedor de lanzamientos de cliente exitosos.”\n\nPriorizando: \nMantener la cartera actual (base-run) → enfoque en lower funnel (conversión y lealtad). Con capacidades para apoyar a clientes Tier 1 y 2 con paquetes de compliance, claims, workshops, etiquetado, mock-ups de producto terminado, visitas a consumidores, etc.\nGeneración de demanda por región + categorías (growth) → crecer sin descuidar cartera (upper y mid funnel). Con inversión en herramientas y reorganización de equipos."], "tables": [[["RACE FRAMEWORK STRATEGY", "MIX  POR RACE FRAMEWORK STRATEGY"], ["REACH \n(CONSTRUIR AUTORIDAD Y PRESENCIA)", "20%"], ["ACT\n(CAPTURAR INTENCIÓN Y CALIFICACIÓN DE LEADS)", "25%"], ["CONVERT\n(ACCOUNT-BASED MARKETING Y SOPORTE A VENTAS)", "30%"], ["ENGAGE\n(CROSS-SELLING Y DEFENSA ANTE COMPETENCIA)", "25%"]], [["REGION", "Mix por región"], ["WEST (incluye CA)\n(RENTABILIDAD)", "32%"], ["NORTHEAST\n(RENTABILIDAD)", "32%"], ["SOUTH\n(VOLUMEN)", "22%"], ["MIDWEST\n(VOLUMEN)", "14%"]]]}, {"number": 9, "texts": ["LANZAMIENTO DE NUEVOS PRODUCTOS", "Ranking de rentabilidad en clusters de preferencias olfativas (+ a -) por capacidad de “premiumization” y diferenciación:\n1) Sweet / Comfort / Gourmand\nEstacionalidad fuerte +compras por impulso y colecciones (velas y home fragrance y premium). \nTendencia 27-28: Lujo en el cuidado de la ropa (opciones sostenibles + aromas para “dormir bien”)\n2) Floral / Herbal / Relax\nBienestar/relajación y perfiles más sofisticados en fine fragrance cuando son diferenciados. \nTendencia 27-28: Cuidado del hogar (equilibrio + relajación + satisfacción emocional)\n3) Fresh / Citrus / Clean\nSeñal de limpieza en home care/laundry/HI&I (más comparable y precio‑competitivo, salvo en claims/compliance premium)\nTendencia 27-28: Belleza para mascotas (productos perfumados + fórmulas aptas para el uso humano)", "Los aromas en EUA se mueven por preferencias regionales y estacionalidad, y por estándares/requisitos de clientes/retailers. Enfocar el lanzamiento de productos en estacionalidades y tendencias más rentables, con enfoque al desarrollo de nuevos clientes a la par del crecimiento de los existentes, dando cabida a co-creación con clientes estratégicos (Tendencia 27-28: Personalización como deseo de fragancias únicas y que reflejen la identidad individual).\n\n3 a 5 lanzamientos en 2027, en Q1, Q2 y Q3 (para 2028), conforme al ranking de rentabilidad por preferencias olfativas, considerando las tendencias más rentables. \nCo-creación semestral con briefs olfativos de clientes más valiosos (dependiendo categoría), en 2027."], "tables": []}, {"number": 10, "texts": ["IMPACTO EN P&L", "", "Medir KPIs críticos de Marketing para control del presupuesto, verificando que por cliente y mercado se mantenga un margen bruto saludable (idealmente min. 30% a 50%)."], "tables": [[["KPI", "Elementos necesarios del P&L"], ["CPL\n(Cost por Lead)", "• Gastos de Publicidad, PR, y Pauta digital\n• Herramientas de Marketing Digital\n• Costos de Agencias / Eventos / Muestras"], ["CAC\n(Cost de Adquisición de Clientes)", "• Nómina del equipo de Ventas y Marketing\n• Comisiones comerciales\n• Gastos de Viajes y Representación en ferias\n• Costo de entrega de Muestras y Envíos de Laboratorio"], ["CLTV\n(Customer Lifetime Value)", "• Ingresos Totales por Cliente\n• Costo de Ventas y Materia Prima\n• Margen Bruto %"]], [["Simulación de Impacto Presupuestal en Ventas y P&L", ""], ["Métrica de Decisión Comercial", "Escenario Actual"], ["PRESUPUESTO ASIGNADO", ""], ["- Inversión Inbound (Mkt Digital/Contenido)", "$120,000"], ["- Inversión Outbound (Feria/Viajes/Muestras)", "$180,000"], ["Inversión Comercial Total (OpEx)", "$300,000"], ["MÉTRICAS DE RENDIMIENTO", ""], ["- Leads anuales generados", "1,000"], ["- Costo Promedio por Lead (CPL)", "$160"], ["- Tasa de Conversión (Lead a Cliente)", "5.0%"], ["- Nuevos clientes captados", "50"], ["- Venta Promedio Anual por Cuenta", "$450,000"], ["IMPACTO FINANCIERO (P&L)", ""], ["- Nuevos Ingresos Generados", "$22,500,000"], ["- Margen Bruto Promedio de Fragancia", "60.0%"], ["- Utilidad Bruta de Nuevas Ventas", "$13,500,000"], ["- CAC Promedio por Nuevo Cliente", "$6,000"], ["RETORNO (Rentabilidad de Campaña)", ""], ["- Utilidad Neta", "$13,200,000"]], [["Estado de Resultados (P&L) y KPIs Consolidados Anuales", "", "", ""], ["Concepto Financiero", "Monto (USD)", "Métricas de Embudo", "Valor"], ["Ingresos Totales", r mix: manufacturers (home care/laundry/HI&I) y marcas medianas orientadas a volumen."], ["04", "Midwest", "Tendencia a: “clean/functional” (señales de limpieza, notas frescas/ligeras)", "Buyer mix: CPG, HI&I manufacturers y canales masivos."]], "targets": "Target growth: Clientes con mayor valor estratégico y rentabilidad de los segmentos:\nPremium pipeline: Brand owners/CMOs y fabricantes de productos diferenciados y premium (más rentables) en regiones más rentables de Northeast y West. \nValue pipeline: Home care/laundry/HI&I y distribuidores como palancas para escalar el negocio (sostener margen con compliance).\n\nTarget base-run Mantenimiento de cartera actual:\n\nClientes por Tier 1 a 3*, de más a menos valiosos.", "products": [["01", "Sweet / Comfort / Gourmand", "Estacionalidad fuerte +compras por impulso y colecciones (velas y home fragrance y premium).", "Tendencia 27-28: Lujo en el cuidado de la ropa (opciones sostenibles + aromas para “dormir bien”)"], ["02", "Floral / Herbal / Relax", "Bienestar/relajación y perfiles más sofisticados en fine fragrance cuando son diferenciados.", "Tendencia 27-28: Cuidado del hogar (equilibrio + relajación + satisfacción emocional)"], ["03", "Fresh / Citrus / Clean", "Señal de limpieza en home care/laundry/HI&I (más comparable y precio‑competitivo, salvo en claims/compliance premium)", "Tendencia 27-28: Belleza para mascotas (productos perfumados + fórmulas aptas para el uso humano)"]], "launch": "Los aromas en EUA se mueven por preferencias regionales y estacionalidad, y por estándares/requisitos de clientes/retailers. Enfocar el lanzamiento de productos en estacionalidades y tendencias más rentables, con enfoque al desarrollo de nuevos clientes a la par del crecimiento de los existentes, dando cabida a co-creación con clientes estratégicos (Tendencia 27-28: Personalización como deseo de fragancias únicas y que reflejen la identidad individual).\n\n3 a 5 lanzamientos en 2027, en Q1, Q2 y Q3 (para 2028), conforme al ranking de rentabilidad por preferencias olfativas, considerando las tendencias más rentables. \nCo-creación semestral con briefs olfativos de clientes más valiosos (dependiendo categoría), en 2027.", "benchmark": ["IFF → SCENT CHAT: permite que participantes seleccionados se comuniquen en tiempo real con perfumistas, a través de WA y FB. Analizando las respuestas genera insights para toma de decisiones en el desarrollo. (IFF, 2025)", "DSM-FIRMENICH → PROVEEDOR DE SOLUCIONES PARA EL CONSUMIDOR ACTUAL Y FUTURO: cómo reciben nuevas fragancias, compras digitales sin oler primero, estrategia para identificar futuras oportunidades - Stephanie K., Associate Director Perfumery", "GIVAUDAN → PROVEEDOR DE LANZAMIENTOS EXITOSOS: apoyan al cliente con claims, workshops, etiquetado y visualización de producto terminado y realizan visitas directas a consumidores, o desarrollan estudios conjuntamente  - Paulina A., Fragrance Director"], "benchmarkCommon": "En común: \nMarketing ABM (Account-based) con equipos multidisciplinarios por categoría (ej. Beauty / Home Care / Fine Fragrance) \nTratan a sus perfumistas como celebridades.", "budgetContext": "Propuesta de asignación, asumiendo el posicionamiento más rentable (con hipótesis de capacidades de los equipos internos): “Frallier como proveedor de lanzamientos de cliente exitosos.”\n\nPriorizando: \nMantener la cartera actual (base-run) → enfoque en lower funnel (conversión y lealtad). Con capacidades para apoyar a clientes Tier 1 y 2 con paquetes de compliance, claims, workshops, etiquetado, mock-ups de producto terminado, visitas a consumidores, etc.\nGeneración de demanda por región + categorías (growth) → crecer sin descuidar cartera (upper y mid funnel). Con inversión en herramientas y reorganización de equipos."}},F=D.full,ICONS={"Candy":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true const money=s=>/^\$?[\d,]+(?:\.\d+)?%?$/.test(String(s).trim());
function rowClass(r){const label=String(r[0]).trim();if(/^(TOTALES|Total OpEx|Inversión Comercial Total)/i.test(label))return'row-total';if(/^(Utilidad Bruta|Utilidad Operativa|\s*-\s*Utilidad Neta)/i.test(label))return'row-subtotal';if(!r.slice(1).some(v=>String(v).trim())&&label&&label===label.toUpperCase())return'row-group';return'';}
function table(rows,cls='',widths=[]){return `<div class="table-shell"><table class="${cls}">${widths.length?`<colgroup>${widths.map(w=>`<col style="width:${w}%">`).join('')}</colgroup>`:''}<thead><tr>${rows[0].map((v,i)=>`<th scope="col" ${i===rows[0].length-1&&rows.slice(1).some(r=>money(r[i]))?'class="num"':''}>${text(v)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr class="${rowClass(r)}">${r.map((v,i)=>`<td class="${money(v)?'num ':''}${i===0?'identity-cell':''}">${text(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function clickCue(pending,cls='tab-action'){return pending?`<small class="${cls} click-cue"><span>Click para ver ↗</span><svg class="cue-outline" viewBox="0 0 120 28" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect x="1" y="1" width="118" height="26" rx="7" ry="7" pathLength="100" vector-effect="non-scaling-stroke"/></svg></small>`:`<small class="${cls}"></small>`;}
function tabs(items){$('#view-tabs').classList.remove('pestle-selector');$('#view-tabs').innerHTML=items.map((s,i)=>`<button role="tab" id="view-${i}" data-view="${i}" aria-controls="content" aria-selected="${view===i}"><span>${s}</span>${clickCue(view!==i)}</button>`).join('');}
function trace(){return `<div class="trace-art"><svg viewBox="0 0 730 740" aria-hidden="true">${Array.from({length:14},(_,i)=>{let x=70+i*18,y=20+i*8;return `<path style="--i:${i}" d="M${x-25} 710 C${x-70} 640 ${x+15} 555 ${x+38} 465 C${x+83} 290 ${x-65} 266 ${x-43} 156 C${x-30} ${y} ${x+130} ${y-80} ${x+205} ${y+55} C${x+279} ${y+198} ${x+139} 423 ${x+290} 577 C${x+321} 611 ${x+345} 640 ${x+375} 659"/>`;}).join('')}</svg></div>`;}
function hero(){return `<section class="hero"><div class="hero-left">${trace()}<p class="role">MARKETING MANAGER US</p><h1>Estrategia anual</h1><div class="hero-year">USA <span>2027</span></div><p class="hero-sub">PROPUESTA DE MARKETING · FRAGANCIAS</p><button class="start-button" data-go="1"><i aria-hidden="true">↗</i><span>Haz clic aquí para comenzar</span></button></div><div class="hero-right"><img class="hero-brand" src="${ASSETS.frallier}" alt="Frallier"><div class="hero-collab"><span>EN COLABORACIÓN CON</span><img src="${ASSETS.daniela}" alt="Daniela Lozada Cauduro"></div></div></section>`;}
function pestle(){const rows=D.source[1].tables[0].slice(1),r=rows[view],names=['Político','Económico','Social','Tecnológico','Legal','Ambiental'];$('#view-hint').textContent='Haz clic en una letra: su análisis aparece a la derecha.';const nav=`<nav class="pestle-rail" role="tablist" aria-label="Factores PESTLE" aria-orientation="vertical" data-factor-nav>${names.map((n,i)=>`<button role="tab" id="view-${i}" data-view="${i}" aria-controls="pestle-panel" aria-selected="${view===i}"><strong class="factor-key">${rows[i][0]}</strong><span class="factor-name">${n}</span>${clickCue(view!==i)}</button>`).join('')}</nav>`;return `<div class="pestle-layout">${nav}<section id="pestle-panel" role="tabpanel" aria-labelledby="view-${view}"><h2 class="pestle-panel-heading">${text(r[1].replace(/\n/g,' '))}</h2><table class="pestle-table"><thead><tr><th scope="col">Análisis</th><th scope="col">Implicación</th></tr></thead><tbody><tr><td data-label="ANÁLISIS"><div class="pestle-copy">${text(r[2])}</div></td><td data-label="IMPLICACIÓN"><div class="pestle-copy">${text(r[3])}</div></td></tr></tbody></table></section></div>`;}
function benchmark(){return `<div class="bench-grid">${F.benchmark.map(s=>{const[company,rest]=s.split('→'),n=rest.indexOf(':');return `<article><p class="company">${text(company.trim())}</p><h2>${text(rest.slice(0,n).trim())}</h2><p>${text(rest.slice(n+1).trim())}</p></article>`;}).join('')}</div><div class="bench-common"><b>EN COMÚN</b><div>${text(F.benchmarkCommon.replace('En común:','').trim())}</div></div>`;}
function segmentation(){tabs(['Compradores','Preferencias olfativas','Target']);$('#view-hint').textContent='Haz clic en una vista para recorrer la segmentación y sus targets.';if(view===0)return `<p class="caption">Compradores de fragancias B2B en EUA, por rentabilidad de mayor a menor.</p><table class="segment-table"><colgroup><col style="width:5%"><col style="width:39%"><col style="width:56%"></colgroup><thead><tr><th>Orden</th><th>Comprador</th><th>Prioridades y condiciones</th></tr></thead><tbody>${F.buyers.map((r,i)=>`<tr><td class="rank">${r[0]}</td><td class="buyer-type"><div class="cell-stack">${ico(['Crown','Factory','Boxes','Network'][i])}<span>${text(r[1])}</span></div></td><td>${text(r[2])}</td></tr>`).join('')}</tbody></table>`;
if(view===1)return `<p class="caption">Clusters de preferencias olfativas en EUA, por región y rentabilidad de mayor a menor.</p><table class="segment-table"><colgroup><col style="width:5%"><col style="width:23%"><col style="width:30%"><col style="width:42%"></colgroup><thead><tr><th>Orden</th><th>Región</th><th>Tendencia olfativa</th><th>Buyer mix</th></tr></thead><tbody>${F.regions.map((r,i)=>`<tr><td class="rank">${r[0]}</td><td class="buyer-type"><div class="cell-stack">${ico(['Candy','Leaf','Citrus','Sparkles'][i])}<span>${text(r[1])}</span></div></td><td data-label="TENDENCIA">${text(r[2].replace('Tendencia a: ',''))}</td><td data-label="BUYER MIX">${text(r[3].replace('Buyer mix: ',''))}</td></tr>`).join('')}</tbody></table>`;
const parts=F.targets.split('Target base-run');return `<div class="targets"><section><span class="target-icon">${ICONS.TrendingUp}</span><h2>Target (growth)</h2><p>${text(parts[0].replace('Target growth:','').trim()).replace('Premium pipeline:','<strong>Premium pipeline:</strong>').replace('Value pipeline:','<strong>Value pipeline:</strong>')}</p></section><section><span class="target-icon">${ICONS.RefreshCw}</span><h2>Target (base-run)</h2><p>${esc(parts[1].trim()).replace(/\n/g,'<br>')}</p></section></div>`;}
function funnel(){return `<div class="funnel" role="tablist" aria-label="Etapas de RACE">${D.race.map((r,i)=>`<button role="tab" id="stage-${i}" data-stage="${i}" aria-controls="stage-panel" aria-selected="${stage===i}">${ico(['Radio','MousePointer2','Handshake','HeartHandshake'][i])}<span>${r.name}</span>${clickCue(stage!==i,'stage-open')}</button>`).join('')}</div>`;}
function race(){const a=D.race[stage],r=D.source[5].tables[0][stage+1];$('#view-hint').textContent='Haz clic en una etapa para ver sus puntos de contacto y herramientas.';return `<div class="stage-layout">${funnel()}<div id="stage-panel" role="tabpanel" aria-labelledby="stage-${stage}"><h2 class="stage-title">${text(a.goal)}</h2><div class="stage-reading"><section><h3>PUNTOS DE CONTACTO FÍSICOS / DIGITALES Y ACTIVIDADES</h3><ol class="stage-list">${r[1].split('\n').filter(Boolean).map(s=>`<li><span>${text(s)}</span></li>`).join('')}</ol></section><section><h3>HERRAMIENTAS DIGITALES</h3><ul class="tools-list">${r[2].split('\n').filter(Boolean).map(s=>`<li>${text(s)}</li>`).join('')}</ul></section></div></div></div>`;}
function kpis(){const a=D.race[stage],r=D.source[6].tables[0][stage+1];$('#view-hint').textContent='Haz clic en una etapa para consultar sus KPIs.';return `<div class="stage-layout">${funnel()}<div id="stage-panel" role="tabpanel" aria-labelledby="stage-${stage}"><h2 class="stage-title">${text(a.goal)}</h2><ul class="kpi-list ${stage===2?'':'single'}">${r[1].split('\n').filter(Boolean).map(s=>`<li>${text(s)}</li>`).join('')}</ul></div></div>`;}
function pie(values,labels,id){let angle=-Math.PI/2;const colors=['#e8ba61','#f2eee0','#a8bdb0','#789da8'],inks=['#233647','#233647','#233647','#152c3b'];return `<svg class="mix-pie" viewBox="0 0 240 240" role="img" aria-labelledby="${id}-title ${id}-desc"><title id="${id}-title">${id==='race-pie'?'Mix por RACE Framework':'Mix por región'}</title><desc id="${id}-desc">${labels.map((l,i)=>esc(l)+': '+values[i]+'%').join('; ')}</desc>${values.map((v,i)=>{const a=angle,b=a+v/100*Math.PI*2;angle=b;const point=r=>[120+Math.cos(r)*112,120+Math.sin(r)*112],p=point(a),q=point(b),m=(a+b)/2;return `<g><path d="M120 120 L${p[0]} ${p[1]} A112 112 0 ${v>50?1:0} 1 ${q[0]} ${q[1]} Z" fill="${colors[i]}" stroke="#253847" stroke-width="3"/><text x="${120+Math.cos(m)*73}" y="${120+Math.sin(m)*73}" text-anchor="middle" dominant-baseline="middle" fill="${inks[i]}" font-size="18" font-weight="700"><tspan x="${120+Math.cos(m)*73}" dy="-5">${v}%</tspan><tspan x="${120+Math.cos(m)*73}" dy="16" font-size="11" font-weight="700">${esc(labels[i])}</tspan></text></g>`;}).join('')}</svg>`;}
function budget(){const colors=['#e8ba61','#f2eee0','#a8bdb0','#789da8'];return `<div class="budget-pies"><section class="mix-panel"><h2>Mix por RACE Framework</h2><div class="mix-body">${pie(D.mix,D.race.map(r=>r.name),'race-pie')}<div class="mix-legend">${D.race.map((r,i)=>`<div class="budget-race"><span class="mix-swatch" style="background:${colors[i]}"></span><span class="percent">${D.mix[i]}%</span><div><strong>${r.name}</strong><span class="intent">${text(D.source[7].tables[0][i+1][0].split('\n').slice(1).join(' ').replace(/^\(|\)$/g,''))}</span></div></div>`).join('')}</div></div></section><section class="mix-panel"><h2>Mix por región</h2><div class="mix-body">${pie(D.regionMix.map(r=>r[1]),D.regionMix.map(r=>r[0]),'region-pie')}<div class="mix-legend">${D.regionMix.map((r,i)=>`<div class="region-row"><span class="mix-swatch" style="background:${colors[i]}"></span><b>${r[1]}%</b><span><strong class="place">${r[0]}${i===0?' (incluye CA)':''}</strong><small>${i<2?'Rentabilidad':'Volumen'}</small></span></div>`).join('')}</div></div></section></div><div class="budget-copy">${text(F.budgetContext)}</div>`;}
function products(){tabs(['Familias olfativas','Enfoque y calendario']);$('#view-hint').textContent='Haz clic en una vista para explorar las propuestas y su calendario.';if(view===0)return `<p class="caption">Ranking por capacidad de premiumization y diferenciación, de mayor a menor rentabilidad.</p><div class="products">${F.products.map((r,i)=>`<article><div class="product-icon"><span class="product-rank">${r[0]}</span>${ico(['Candy','Flower2','Citrus'][i])}</div><h2>${text(r[1])}</h2><p>${text(r[2])}</p><p class="trend">${text(r[3])}</p></article>`).join('')}</div>`;return launchPlan();}
function launchPlan(){const paragraphs=F.launch.split(/\n+/).filter(s=>s.trim()),intro=paragraphs[0],split=intro.indexOf(' Enfocar'),drivers=intro.slice(0,split),focus=intro.slice(split+1);return `<div class="launch-infographic"><div class="launch-principles"><section><div class="launch-heading">${ico('MapPin')}<h2>Qué guía el lanzamiento</h2></div><p>${text(drivers)}</p></section><section><div class="launch-heading">${ico('SlidersHorizontal')}<h2>Enfoque</h2></div><p>${text(focus)}</p></section></div><div class="launch-calendar"><section class="launch-window"><div class="launch-stat"><span>3–5</span><div>LANZAMIENTOS<br><b>2027</b></div>${ico('Rocket')}</div><ol class="quarter-line" aria-label="Ventanas de lanzamiento"><li><b>Q1</b><span>2027</span></li><li><b>Q2</b><span>2027</span></li><li><b>Q3</b><span>para 2028</span></li></ol><p>${text(paragraphs[1])}</p></section><section class="cocreation-window"><div class="launch-heading">${ico('RefreshCw')}<h2>Co-creación</h2></div><div class="cadence"><span>Semestral</span><b>2027</b></div><p>${text(paragraphs[2])}</p></section></div></div>`;}
function finance(){tabs(['KPIs y costos','Simulación A','Simulación B']);$('#view-hint').textContent='Haz clic en una vista. Las simulaciones A y B son ejemplos independientes.';const ts=D.source[9].tables;if(view===0)return `<div class="drivers"><p>${text(D.source[9].texts.filter(t=>t.trim()!=='IMPACTO EN P&L').join('\n'))}</p>${table(ts[0])}</div>`;if(view===1){const h=ts[1][1],rows=ts[1].slice(2);return `<p class="scenario-tag">EJEMPLO INDEPENDIENTE · USD</p><div class="financial-tables">${table([h,...rows.slice(0,9)],'', [70,30])}${table([h,...rows.slice(9)],'', [70,30])}</div>`;}const t=ts[2];return `<p class="scenario-tag">EJEMPLO INDEPENDIENTE · USD</p><div class="financial-tables consolidated">${table(t.slice(1),'consolidated-table',[41,14,32,13])}</div>`;}
function roi(){const t=D.source[10].tables[0],rows=t.slice(2);if(innerWidth>700)return `<p class="caption">Venta anual, margen bruto e inversión por cuenta. Cifras en USD.</p>${table([t[1],...rows],'roi-table',[17,11,11,8,11,8,12,11,11])}`;const r=rows[account],total=account===rows.length-1;$('#view-hint').textContent='Haz clic en una cuenta o en Total para ver todos sus datos.';return `<div class="roi-mobile"><div class="account-switch" role="tablist" aria-label="Cuentas y totales">${rows.map((x,i)=>`<button role="tab" data-account="${i}" id="account-${i}" aria-controls="account-profile" aria-selected="${i===account}">${i===rows.length-1?'Total':String(i+1).padStart(2,'0')}</button>`).join('')}</div><section id="account-profile" role="tabpanel" aria-labelledby="account-${account}"><h2 class="account-title">${text(r[0])}</h2>${!total?`<p class="account-market">${text(r[1])}</p>`:''}<dl class="account-data">${t[1].slice(2).map((label,i)=>`<dt>${text(label)}</dt><dd>${text(r[i+2])}</dd>`).join('')}</dl></section></div>`;}

function render(){document.body.classList.toggle('dark',darkChapters.includes(chapter));$('main').classList.toggle('cover-mode',chapter===0);$('#topic-title').textContent=titles[chapter];$('#screen-number').textContent=String(chapter+1).padStart(2,'0');$('#view-tabs').classList.remove('pestle-selector');$('#view-tabs').innerHTML='';$('#view-hint').textContent='';$('#content').innerHTML=renderers[chapter]();$('#pestle-actions').hidden=chapter!==1;$('#content').style.animationName='none';void $('#content').offsetWidth;$('#content').style.animationName='reveal';$('#scroller').scrollTop=0;$('#content').style.setProperty('--panel-height',$('#scroller').clientHeight+'px');$('#prev').disabled=chapter===0;$('#next').disabled=chapter===9;$('#count').textContent=`${String(chapter+1).padStart(2,'0')} / 10`;$('#progress').style.setProperty('--progress',`${(chapter+1)*10}%`);document.querySelectorAll('[data-toc]').forEach(b=>b.setAttribute('aria-current',+b.dataset.toc===chapter));history.replaceState(null,'',`#${chapter+1}`);$('#live').textContent=titles[chapter];requestAnimationFrame(()=>{updateCue();requestAnimationFrame(updateCue)});}
function go(n){chapter=Math.max(0,Math.min(9,n));view=0;stage=0;account=0;render();}
function selectView(n){view=Math.max(0,Math.min((viewCounts[chapter]||1)-1,n));render();document.getElementById('view-'+view)?.focus({preventScroll:true});}
function selectStage(n){stage=Math.max(0,Math.min(3,n));render();document.getElementById('stage-'+stage)?.focus({preventScroll:true});}
function selectAccount(n){account=Math.max(0,Math.min(5,n));render();document.querySelector(`[data-account="${account}"]`)?.focus({preventScroll:true});}
function updateCue(){const s=$('#scroller'),end=$('#scroll-end');const remaining=end?end.getBoundingClientRect().top-s.getBoundingClientRect().bottom:0;const more=chapter!==0&&remaining>4;$('#scroll-cue').classList.toggle('visible',more);$('#scroll-cue').setAttribute('aria-hidden',String(!more));$('#scroll-cue').setAttribute('aria-label',more?'Hay más información. Haz clic para verla.':'Todo el contenido de esta vista está visible.');}
$('#pestle-actions').innerHTML=`<div class="general-actions-heading"><h2 id="pestle-actions-title">Acciones 2026–2027</h2><p>Recomendaciones generales a partir del análisis PESTLE completo.</p></div><div class="action-strip">${D.actions.map((a,i)=>`<div class="action"><span>0${i+1}</span><span>${text(a)}</span></div>`).join('')}</div>`;
$('#toc-list').innerHTML=titles.map((t,i)=>`<li><button data-toc="${i}"><small>${String(i+1).padStart(2,'0')}</small><span>${i===0?'Portada':t}</span></button></li>`).join('');
$('#logo').src=ASSETS.frallier;$('#open-toc').onclick=()=>$('#toc').showModal();$('#close-toc').onclick=()=>$('#toc').close();$('#prev').onclick=()=>go(chapter-1);$('#next').onclick=()=>go(chapter+1);
$('#scroll-cue').onclick=()=>{const s=$('#scroller');s.scrollBy({top:Math.max(150,s.clientHeight*.7),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});};
$('#scroller').addEventListener('scroll',updateCue,{passive:true});
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('#fullscreen').title='Pantalla completa no disponible en este navegador';}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined)go(+b.dataset.go);if(b.dataset.toc!==undefined){$('#toc').close();go(+b.dataset.toc);}if(b.dataset.view!==undefined)selectView(+b.dataset.view);if(b.dataset.stage!==undefined)selectStage(+b.dataset.stage);if(b.dataset.account!==undefined)selectAccount(+b.dataset.account);});
document.addEventListener('keydown',e=>{if($('#toc').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('[data-factor-nav]')&&['ArrowUp','ArrowDown','ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();selectView((view+(['ArrowUp','ArrowLeft'].includes(e.key)?5:1))%6);return;}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const d=e.key==='ArrowRight'?1:-1;if(e.target.closest('#view-tabs')){e.preventDefault();selectView((view+d+viewCounts[chapter])%viewCounts[chapter]);return;}if(e.target.closest('.funnel')){e.preventDefault();selectStage((stage+d+4)%4);return;}if(e.target.closest('.account-switch')){e.preventDefault();selectAccount((account+d+6)%6);return;}e.preventDefault();go(chapter+d);}if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(9);}});
window.addEventListener('resize',()=>{clearTimeout(window.resizeTimer);window.resizeTimer=setTimeout(render,120)});document.fonts?.ready?.then(render);go(Number(location.hash.slice(1))-1||0);
</script></body></html>
